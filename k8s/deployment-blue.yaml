apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-model-blue
  namespace: ai-model-serving
  labels:
    app: ai-model
    deployment: blue
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-model
      deployment: blue
  template:
    metadata:
      labels:
        app: ai-model
        deployment: blue
        version: v1
    spec:
      containers:
      - name: ai-model
        image: ${REGISTRY}/ai-model:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: MODEL_VERSION
          value: "${MODEL_VERSION}"
        - name: DEPLOYMENT_COLOR
          value: "blue"
        - name: PORT
          value: "5000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
