apiVersion: v1
kind: Service
metadata:
  name: ai-model-service
  namespace: ai-model-serving
  labels:
    app: ai-model
spec:
  type: LoadBalancer
  selector:
    app: ai-model
    # This label will be updated during deployment to point to blue or green
    deployment: blue
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  sessionAffinity: None
